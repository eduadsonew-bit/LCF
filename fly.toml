app = "lcf-liga-caldense-futbol"
primary_region = "bog"

[build]

[env]
  PORT = "3000"
  DATABASE_URL = "file:/data/custom.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "db_data"
  destination = "/data"
